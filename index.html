<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#272c34"><meta name="description" content="Minu 27 rütminuppu Musiccas."><title>Minu rütmid</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#272c34;color:#f5f7fa;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:600px;margin:auto;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top))}h1{font-size:34px;margin:8px 0}header p{font-size:16px;color:#aeb7c5;margin:0 0 20px}.install{color:#bafa69;text-decoration:none;font-weight:650}.presets{display:grid;grid-template-columns:repeat(2,2.7cm);justify-content:start;gap:10px}.preset{min-width:0;min-height:76px;padding:8px;display:flex;align-items:center;text-decoration:none;border:1px solid;border-radius:13px;font:600 15px system-ui,sans-serif;color:#fff;overflow-wrap:anywhere;touch-action:manipulation}.preset:active{filter:brightness(.85)}.disco{background:#164b38;border-color:#36775c}.rock{background:#173963;border-color:#3e6598}.jazz-light{background:#858b94;color:#161b22;border-color:#a9adb4}.jazz{background:#666b73;border-color:#92979e}.waltz{background:#fff;color:#161b22;border-color:#d6dbe2}.hint{font-size:14px;color:#b9c2cf;line-height:1.4;margin-top:16px}a:focus-visible{outline:3px solid #bafa69;outline-offset:3px}@media(max-width:360px){main{padding:20px 14px}.presets{gap:6px}.preset{font-size:14px;padding:8px 6px}}
</style></head><body><main><header><h1>Minu rütmid</h1><p>Kasuta Firefoxi ja Tampermonkeyt. <a class="install" href="https://github.com/MoonikaLutsius-code/minu-rutmid-veeb/blob/main/minu-rutmid-install.user.js">Paigalda skript</a></p></header><section class="presets" id="tracks" aria-label="Lemmikrütmid"></section><p class="hint">Rütmi peatamiseks puuduta halli ekraani või vajuta Enterit. Uue rütmi valimiseks ära vajuta brauseri Back-nuppu.</p></main>
<script>
const groups=[['disco','60,68,70,80','n-44-a--5aeghimop6em7aeim-5sa','Disco2'],['rock','53,60,63,65,70,75,80','n-44-a--5acegikmo6em7ai-','PopRock1'],['jazz-light','70,100,105,110,115,120','n-44-a--1em4aegimo6m7a-','Jazz2'],['jazz','70,100,105,110,115,120','y-44-a--1em4aegimo6m7a-','Swing-Jazz2'],['waltz','140,150,155,160','n-34-a--5ei6a-','3/4']];
const list=document.getElementById('tracks');for(const [kind,tempos,pattern,label] of groups)for(const tempo of tempos.split(',')){const link=document.createElement('a');link.className='preset '+kind;link.href='https://www.musicca.com/drum-machine#data='+tempo+'-'+pattern;link.textContent=tempo+'-'+label;list.appendChild(link)}
</script></body></html>
